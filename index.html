<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css" >
   
  
</head>
<body>

<div class="container">

    <!-- ABAS DE PROJETOS -->
    <div class="abas-wrapper" id="abas-wrapper">
        <div class="aba-item ativo" data-id="projeto_1790872835544">
            <span class="nome-aba" contenteditable="true" title="Clique para editar o nome">Meu Projeto</span>
            <button class="btn-editar-aba" title="Renomear projeto (clique no nome)">✎</button>
            <button class="btn-fechar-aba" title="Excluir projeto">✕</button>
        </div>
        <!-- as abas serão inseridas aqui via JS -->
        <button class="btn-nova-aba" id="btnNovaAba" title="Criar novo projeto">+</button>

    </div>

    <header>
        <h1>
            📋
            <span id="nome-projeto-atual" class="nome-projeto-editavel" contenteditable="true">Task List</span>
        </h1>
     
    </header>

    <div class="sync-bar">
        <button class="btn-sync" onclick="exportarProjetoAtual()">⬇ Exportar Projeto</button>
        <button class="btn-sync" onclick="document.getElementById('input-arquivo').click()">⬆ Importar Projeto</button>
        <input type="file" id="input-arquivo" accept=".json" style="display: none;" onchange="importarProjeto(event)">
    </div>

    <div class="card-adicionar">
        <h3>Adicionar Nova Tarefa ou Nota</h3>
        <div class="form-group">
            <input type="text" id="input-titulo" placeholder="Nome da tarefa..." onkeydown="if(event.key === 'Enter') adicionarTarefa()">
            <select id="select-secao-add">
                <option value="0">📌 Geral / Sem Divisória</option>
            </select>
        </div>
        <div class="form-group">
            <input type="text" id="input-obs" placeholder="Observações ou detalhes (opcional)..." onkeydown="if(event.key === 'Enter') adicionarTarefa()">
            <button class="btn-adicionar" onclick="adicionarTarefa()">Adicionar Tarefa</button>
            <button class="btn-secundario" onclick="alternarPainelDivisoria()">➕ Nova Divisória</button>
        </div>

        <div id="painel-divisoria" class="painel-divisoria">
            <h4>📂 Criar Nova Divisória</h4>
            <div class="form-group" style="margin-bottom: 0;">
                <input type="text" id="input-nome-divisoria" placeholder="Nome da divisória (ex: Módulo 3 - Testes)..."
                 onkeydown="tratarTeclasDivisoria(event)">

                <button class="btn-adicionar" onclick="confirmarCriarDivisoria()">Criar Divisória</button>
                <button class="btn-secundario" onclick="alternarPainelDivisoria(false)">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="divisoria divisoria-concluidas">
        <div class="divisoria-header">
            <span>✨ Concluídas</span>
            <span id="contador-concluidas" style="font-size: 13px;">(0)</span>
        </div>
        <ul id="lista-concluidas" class="lista-tarefas"></ul>
    </div>

    <div class="divisoria divisoria-pendentes">
        <div class="divisoria-header">
            <span>⚡ Pendentes</span>
            <span id="contador-pendentes" style="font-size: 13px;">(0)</span>
        </div>
        <ul id="lista-pendentes" class="lista-tarefas"></ul>
    </div>
</div>

<script src="scipt.js"> </script>
  


</body>
</html>
